openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
  description: API for our TODOLIST application
servers:
  - url: 'http://localhost:3005'
    description: Development server
paths:
  /auth/register:
    post:
      summary: User registration
      description: Registers a new user.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "John"
                last_name:
                  type: string
                  example: "Doe"
                email:
                  type: string
                  example: "john.doe@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  first_name:
                    type: string
                    example: "John"
                  last_name:
                    type: string
                    example: "Doe"
                  email:
                    type: string
                    example: "john.doe@example.com"
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /auth/login:
    post:
      summary: User login
      description: Authenticates a user and returns a JWT token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "test1@dauphine.eu"
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Invalid credentials
        '500':
          description: Internal server error
  /api/groups/all/all:
    get:
      summary: Get all groups
      security:
        - bearerAuth: []
      tags:
        - Groups
      responses:
        '200':
          description: A list of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 6
                    name:
                      type: string
                      example: "my grp 1"
                    description:
                      type: string
                      example: "grp 1"
                    nbUsers:
                      type: integer
                      example: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "An unexpected error occurred"
  /api/tasks/all/all:
    get:
      summary: Get all tasks
      security:
        - bearerAuth: []
      tags:
        - Tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: "Conception de L'application web todo List"
                    category:
                      type: string
                      example: "conception"
                    description:
                      type: string
                      example: "LLorem Ipsum is simply t."
                    deadline:
                      type: string
                      format: date-time
                      example: "2024-12-04T23:00:00.000Z"
                    creation_date:
                      type: string
                      format: date-time
                      example: "2024-12-03T06:50:49.000Z"
                    type:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: "Collaborative"
                    status:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 3
                        name:
                          type: string
                          example: "Completed"
                    group:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: "Groupe 2"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "An unexpected error occurred"
  /api/tasks:
    post:
      summary: Create a new task
      security:
        - bearerAuth: []
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "New Task"
                category:
                  type: string
                  example: "Work"
                description:
                  type: string
                  example: "This is a new task description"
                deadline:
                  type: string
                  format: date-time
                  example: "2023-12-31T23:59:59Z"
                typeTaskId:
                  type: integer
                  example: 1
                groupId:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task created successfully"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "A collaborative task must be assigned to a group"
        '404':
          description: User or group not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "An unexpected error occurred"
    get:
      summary: Get all tasks
      security:
        - bearerAuth: []
      tags:
        - Tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: "Conception de L'application web todo List"
                    category:
                      type: string
                      example: "conception"
                    description:
                      type: string
                      example: "LLorem Ipsum is simply t."
                    deadline:
                      type: string
                      format: date-time
                      example: "2024-12-04T23:00:00.000Z"
                    creation_date:
                      type: string
                      format: date-time
                      example: "2024-12-03T06:50:49.000Z"
                    type:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: "Collaborative"
                    status:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 3
                        name:
                          type: string
                          example: "Completed"
                    group:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: "Groupe 2"
        '401':
          description: Unauthorized
          content:
